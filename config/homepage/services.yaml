- Infraestructura:
    - Proxmox:
        icon: proxmox.svg
        href: https://192.168.1.10:8006
        description: Proxmox VE 9.2.4 · nodo quesada
        widget:
          type: proxmox
          url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
          username: "{{HOMEPAGE_VAR_PROXMOX_USER}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          node: quesada
          fields:
            - vms
            - lxc
            - resources.cpu
            - resources.mem

    - OpenWrt:
        icon: openwrt.svg
        href: http://192.168.1.1
        description: Router y firewall LAN

    - AdGuard Home:
        icon: adguard-home.svg
        href: http://192.168.1.20
        description: DNS local y filtrado
        widget:
          type: adguard
          url: http://192.168.1.20
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASS}}"
          fields:
            - queries
            - blocked
            - filtered
            - latency

