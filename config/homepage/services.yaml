        description: 4 vCPU · 4 GiB RAM · 64 GB · proveedor externo

    - Discord:
        icon: discord.svg
        href: https://discord.com/channels/1516903550696034417/1528758416565342338
        description: Canal privado de Hermes

    - Telegram:
        icon: telegram.svg
