- Servicios críticos:
    - Traefik:
        icon: traefik-proxy.svg
        href: http://traefik.lab/dashboard/
        description: Entrada interna para aplicaciones LAN
        server: my-docker
        container: traefik
        widget:
          type: traefik
          url: http://traefik:8080

    - Cloudflare Tunnel:
        icon: cloudflare.svg
        href: https://dash.cloudflare.com
