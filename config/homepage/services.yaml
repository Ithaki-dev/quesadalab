    - Vaultwarden:
        icon: vaultwarden.svg
        href: https://vault.lab
        description: Gestor privado de contraseñas
        server: my-docker
        container: vaultwarden

    - OmniRoute:
        icon: mdi-routes
        href: https://omniroute.lab
        description: Gateway de IA para Hermes y clientes OpenAI-compatible
        server: my-docker
        container: omniroute

